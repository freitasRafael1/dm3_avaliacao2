import java.util.Properties

pluginManagement {
    try {
        def pe = Class.forName("java.lang.ProcessEnvironment")
        def field
        try {
            field = pe.getDeclaredField("theCaseInsensitiveEnvironment")
        } catch (e) {
            field = pe.getDeclaredField("theEnvironment")
        }
        field.setAccessible(true)
        def map = field.get(null)
        map.remove("ANDROID_PREFS_ROOT")
    } catch (e) {}

    def flutterSdkPath = {
        def properties = new Properties()
        file('local.properties').withInputStream { properties.load(it) }
        def sdkPath = properties.getProperty('flutter.sdk')
        assert sdkPath != null, "flutter.sdk not set in local.properties"
        return sdkPath
    }()

    includeBuild "${flutterSdkPath}/packages/flutter_tools/gradle"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
